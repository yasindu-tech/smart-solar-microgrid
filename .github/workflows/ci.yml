# ---------------------------------------------------------------------------
#  Smart Solar Microgrid Trading System - CI
#
#  Quality Gate detects which component changed and, on a pull request, also
#  runs the repo guards (no secrets/build output, Conventional Commit PR
#  title) — one check instead of three. The three build jobs each use its
#  path filter output so a backend change does not rebuild Android. Quality
#  Gate plus the three build jobs are the required status checks on main and
#  develop, configured once in GitHub branch protection settings.
#
#  Job names must stay stable: branch protection matches them by name.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      # Full history so paths-filter and the guard steps below can diff
      # locally against the base branch instead of calling the GitHub API.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

      # The remaining guard steps only make sense on a pull request: they
      # diff against the PR's base branch and read the PR title, neither of
      # which exists on a plain push to develop/main.
      - name: Guard - no secrets or build output
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true

          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD || git diff --name-only HEAD~1...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          BLOCKED_PATTERN='(^|/)(appsettings\.Development\.json|appsettings\.Production\.json|\.env|local\.properties|google-services\.json|secrets\.json)$|\.(apk|aab|keystore|jks|pfx|p12|pem|key)$|(^|/)(bin|obj|node_modules|dist|build)/'

          if echo "$CHANGED" | grep -nE "$BLOCKED_PATTERN"; then
            echo ""
            echo "::error::This PR adds files that must never be committed."
            echo "Credentials, signing material and build output stay out of the repo."
            echo "Remove them, add the path to .gitignore, and force-push the branch."
            exit 1
          fi

          echo "No blocked paths in this diff."

      - name: Guard - no hard-coded credentials
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          BASE="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true

          # Look only at added lines, so pre-existing text does not fail the PR.
          ADDED=$(git diff "$BASE"...HEAD -U0 | grep '^+' | grep -v '^+++' || true)

          if echo "$ADDED" | grep -inE 'mongodb\+srv://[^<"]*:[^<"@]+@|AIza[0-9A-Za-z_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----'; then
            echo ""
            echo "::error::A credential appears to be hard-coded in this PR."
            echo "Move it to configuration and rotate the exposed value."
            exit 1
          fi

          echo "No hard-coded credentials detected in added lines."

      - name: Guard - PR title is a Conventional Commit
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          PATTERN='^(feat|fix|docs|test|refactor|perf|chore|ci)\((api|web|mobile|auth|user|prosumer|node|slot|resv|qr|view|docs|ci|repo)\): .+'

          if ! echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title must be a Conventional Commit."
            echo "Got:      $TITLE"
            echo "Expected: <type>(<scope>): <summary>"
            echo "Types:    feat fix docs test refactor perf chore ci"
            echo "Scopes:   api web mobile auth user prosumer node slot resv qr view docs ci repo"
            echo "Example:  feat(resv): enforce 12-hour cancellation window (BR-07)"
            exit 1
          fi

          echo "PR title is valid: $TITLE"

  backend-build:
    name: Backend Build
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when backend unchanged
        if: needs.quality-gate.outputs.backend != 'true'
        run: echo "No backend changes - nothing to build."

      - uses: actions/setup-dotnet@v4
        if: needs.quality-gate.outputs.backend == 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        if: needs.quality-gate.outputs.backend == 'true'
        run: dotnet restore backend/SmartSolar.sln

      - name: Build
        if: needs.quality-gate.outputs.backend == 'true'
        run: dotnet build backend/SmartSolar.sln --configuration Release --no-restore

      - name: Test
        if: needs.quality-gate.outputs.backend == 'true'
        run: dotnet test backend/SmartSolar.sln --configuration Release --no-build --verbosity normal

  web-build:
    name: Web Build
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when web unchanged
        if: needs.quality-gate.outputs.web != 'true'
        run: echo "No web changes - nothing to build."

      - uses: actions/setup-node@v4
        if: needs.quality-gate.outputs.web == 'true'
        with:
          node-version: '20'

      - name: Install
        if: needs.quality-gate.outputs.web == 'true'
        working-directory: web
        run: npm install

      - name: Typecheck
        if: needs.quality-gate.outputs.web == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: needs.quality-gate.outputs.web == 'true'
        working-directory: web
        run: npm run build

  mobile-build:
    name: Mobile Build
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when mobile unchanged
        if: needs.quality-gate.outputs.mobile != 'true'
        run: echo "No mobile changes - nothing to build."

      - uses: actions/setup-java@v4
        if: needs.quality-gate.outputs.mobile == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: needs.quality-gate.outputs.mobile == 'true'

      - name: Assemble debug APK
        if: needs.quality-gate.outputs.mobile == 'true'
        working-directory: mobile
        run: gradle assembleDebug --no-daemon

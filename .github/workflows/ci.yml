# ---------------------------------------------------------------------------
#  Smart Solar Microgrid Trading System - CI
#
#  Three build jobs, one per component, each with a path filter so a backend
#  change does not rebuild Android. These three are the required status checks
#  on main and develop, configured once in GitHub branch protection settings.
#
#  Job names must stay stable: branch protection matches them by name.
# ---------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  backend-build:
    name: Backend Build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when backend unchanged
        if: needs.changes.outputs.backend != 'true'
        run: echo "No backend changes - nothing to build."

      - uses: actions/setup-dotnet@v4
        if: needs.changes.outputs.backend == 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        if: needs.changes.outputs.backend == 'true'
        run: dotnet restore backend/SmartSolar.sln

      - name: Build
        if: needs.changes.outputs.backend == 'true'
        run: dotnet build backend/SmartSolar.sln --configuration Release --no-restore

      - name: Test
        if: needs.changes.outputs.backend == 'true'
        run: dotnet test backend/SmartSolar.sln --configuration Release --no-build --verbosity normal

  web-build:
    name: Web Build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when web unchanged
        if: needs.changes.outputs.web != 'true'
        run: echo "No web changes - nothing to build."

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: '20'

      - name: Install
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm install

      - name: Typecheck
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm run typecheck

      - name: Build
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: npm run build

  mobile-build:
    name: Mobile Build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip when mobile unchanged
        if: needs.changes.outputs.mobile != 'true'
        run: echo "No mobile changes - nothing to build."

      - uses: actions/setup-java@v4
        if: needs.changes.outputs.mobile == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: needs.changes.outputs.mobile == 'true'

      - name: Assemble debug APK
        if: needs.changes.outputs.mobile == 'true'
        working-directory: mobile
        run: gradle assembleDebug --no-daemon
